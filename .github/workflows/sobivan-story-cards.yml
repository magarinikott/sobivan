name: SOBIVAN · Шум между строк

on:
  workflow_dispatch:
    inputs:
      send_to_telegram:
        description: "Отправить 5 карточек в Telegram и отметить цитаты использованными"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sobivan-story-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/story_cards/requirements.txt

      - name: Установить Pillow
        run: pip install -r automation/story_cards/requirements.txt

      - name: Собрать пак
        id: generate
        shell: bash
        run: |
          OUTPUT="$RUNNER_TEMP/sobivan-story-cards"
          python automation/story_cards/generate.py --output "$OUTPUT"
          echo "directory=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Сохранить карточки в GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sobivan-story-cards-${{ github.run_number }}
          path: ${{ steps.generate.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Отправить 5 PNG в Telegram отдельными файлами
        if: ${{ inputs.send_to_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/story_cards/send_telegram.py "${{ steps.generate.outputs.directory }}"

      - name: Запомнить использованные цитаты
        if: ${{ inputs.send_to_telegram }}
        run: |
          python automation/story_cards/generate.py \
            --finalize "${{ steps.generate.outputs.directory }}/selection.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/story_cards/state.json
          git commit -m "chore: mark weekly SOBIVAN quotes as used"
          git push
